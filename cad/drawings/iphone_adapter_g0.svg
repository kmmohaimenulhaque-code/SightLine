<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">
  <title>SIGHTLINE G0 iPhone 15 adapter — nominal communication drawing</title>
  <style>
    .plate { fill:#00b8d9; stroke:#132238; stroke-width:2; }
    .phone { fill:#111827; stroke:#e7edf5; stroke-width:2; stroke-dasharray:7 5; }
    .datum { fill:#b6f000; stroke:#132238; stroke-width:2; }
    .dim { stroke:#334155; stroke-width:1.5; marker-start:url(#arrow); marker-end:url(#arrow); }
    .ext { stroke:#64748b; stroke-width:1; stroke-dasharray:4 4; }
    text { font-family:Arial,sans-serif; fill:#172033; font-size:16px; }
    .small { font-size:13px; }
    .title { font-size:24px; font-weight:bold; }
    .warn { fill:#9a3412; font-size:14px; }
  </style>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#334155"/></marker></defs>
  <rect width="1000" height="700" fill="#f8fafc"/>
  <text x="35" y="42" class="title">G0 IPHONE 15 ADAPTER — NOMINAL BODY / DATUM CONCEPT</text>
  <text x="35" y="67" class="small">147.6 × 71.6 × 7.8 nominal • actual unit, case and camera coordinates unmeasured</text>

  <text x="60" y="120">REAR / OPERATOR VIEW (Y–Z)</text>
  <rect x="170" y="145" width="286" height="590" rx="24" class="plate"/>
  <rect x="190" y="165" width="246" height="550" rx="17" class="phone"/>
  <rect x="175" y="685" width="276" height="20" class="datum"/>
  <rect x="175" y="195" width="20" height="490" class="datum"/>
  <rect x="431" y="195" width="20" height="490" class="datum"/>
  <rect x="220" y="178" width="186" height="100" fill="#f8fafc" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="226" y="230" class="small">OPEN REAR CAMERA REGION</text>
  <text x="227" y="250" class="small">no lens position assumed</text>
  <text x="205" y="665" fill="#fff" class="small">soft pads outside datums</text>
  <line x1="170" y1="750" x2="456" y2="750" class="dim"/>
  <line x1="170" y1="735" x2="170" y2="760" class="ext"/><line x1="456" y1="735" x2="456" y2="760" class="ext"/>
  <text x="255" y="742">71.6 body width</text>
  <line x1="490" y1="145" x2="490" y2="735" class="dim"/>
  <line x1="456" y1="145" x2="510" y2="145" class="ext"/><line x1="456" y1="735" x2="510" y2="735" class="ext"/>
  <text x="500" y="450" transform="rotate(90 500 450)">147.6 body height</text>

  <text x="635" y="120">SIDE / BODY FRAME (X–Z)</text>
  <rect x="650" y="155" width="58" height="590" class="plate"/>
  <rect x="674" y="155" width="30" height="590" class="phone"/>
  <line x1="650" y1="770" x2="708" y2="770" class="dim"/>
  <line x1="650" y1="745" x2="650" y2="780" class="ext"/><line x1="708" y1="745" x2="708" y2="780" class="ext"/>
  <text x="636" y="790">7.8 body thickness (schematic scale)</text>
  <text x="760" y="230" class="small">adapter/chassis transform</text>
  <text x="760" y="255" class="small">R = identity in G0</text>
  <text x="760" y="280" class="small">t = [−51.9, 0, 16] mm</text>
  <text x="760" y="340" class="small">hard lower + lateral datums</text>
  <text x="760" y="365" class="small">retainers preload, not locate</text>
  <text x="35" y="675" class="warn">Optical compatibility is UNVERIFIED. Camera, flash, button and connector keep-outs require a measured profile.</text>
</svg>
